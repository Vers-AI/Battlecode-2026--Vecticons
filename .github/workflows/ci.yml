name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cambc (pinned to the engine the platform runs)
        run: pip install cambc==4.0.0

      - name: cambc version
        run: cambc --version

      - name: Build + smoke matches (vs starter-python, local engine)
        run: python3 scripts/ci_smoke.py --cambc cambc 
